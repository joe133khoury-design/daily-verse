plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alain.dailyverse'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alain.dailyverse'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '2.3'
    }

    signingConfigs {
        // One fixed key so every new build installs as an update over the old one
        fixed {
            storeFile file('dailyverse.keystore')
            storePassword 'dailyverse123'
            keyAlias 'dailyverse'
            keyPassword 'dailyverse123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
